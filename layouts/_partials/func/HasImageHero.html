{{/* A hero left empty by a CMS comes as `hero: null`: `with` skips it, where
     `isset` on it warns. */}}
{{ $hasImageHero := false }}
{{ with .Params.hero }}
    {{ with .image }}
        {{ with .src }}
            {{ $hasImageHero = true }}
        {{ end }}
    {{ end }}
{{ end }}
{{ return $hasImageHero }}
