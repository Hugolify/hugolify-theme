{{- /* No front matter behind this hero: it takes the site's hero defaults
       (params.hero.ui, e.g. its theme), as the other heroes do */ -}}
{{- $class := partial "func/GetHeroClasses" (dict "ui" site.Params.hero.ui) -}}
<header class="{{ $class }}">
  <div class="container">
    <div class="row">
      <div class="hero-content">
        <h1>{{ i18n "page404.title" }}</h1>
        <p>{{ i18n "page404.text" }}</p>
      </div>
      <div class="hero-media">
      </div>
    </div>
  </div>
</header>
