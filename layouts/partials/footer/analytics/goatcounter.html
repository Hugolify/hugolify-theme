{{- if and (not .code) (not .endpoint) }}
  {{- errorf "Missing GoatCounter 'code' or 'endpoint' configuration. See https://www.hugolify.io/docs/getting-started/analytics/#goatcounter" }}
{{- end }}
{{- $endpoint := .endpoint | default (printf "https://%s.goatcounter.com/count" .code) }}
<script data-goatcounter="{{ $endpoint }}" src="{{ .src | default "https://gc.zgo.at/count.js" }}" async></script>
