{{- $menu := hugo.Data.menu.header.secondary -}}
{{- with index $menu (partial "func/GetLanguage.html").name -}}
  {{- $menu = . -}}
{{- end -}}
{{- with $menu }}
  <ul class="nav nav-secondary">
    {{- range .links }}
      <li>
        {{- partial "nav/link.html" (dict "link" .) -}}
      </li>
    {{- end }}
  </ul>
{{ end -}}
