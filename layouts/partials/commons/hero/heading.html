{{- if or .surtitle .title }}
  <header class="heading">
  {{- with .surtitle }}
    <p class="surtitle">{{ partial "func/PrepareHTML.html" . }}</p>
  {{- end }}
  {{- with .title }}
    <h1 {{- if and site.Params.search.enable site.Params.search.sort }} data-pagefind-sort="heading"{{ end }}>{{ partial "func/PrepareHTML.html" . }}</h1>
  {{- end }}
  </header>
{{- end }}
