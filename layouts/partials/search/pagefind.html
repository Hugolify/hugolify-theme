{{- if site.Params.search.enable }}
  {{- $uniqueID := now.UnixNano | hash.FNV32a }}

  <script src="/pagefind/pagefind-ui.js"></script>
  <div id="search-{{ $uniqueID }}" class="search"></div>
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      const element = document.getElementById("search-" + {{ $uniqueID }});
      new PagefindUI({
        element: element,
        showEmptyFilters: {{ site.Params.search.showEmptyFilters | default true }},
        showImages: {{ site.Params.search.showImages | default true }},
        showSubResults: {{ site.Params.search.showSubResults | default true }}
      });

      // Pagefind UI renders its own markup: align it with the design system
      const enhance = () => {
        element.querySelectorAll(".pagefind-ui__search-input:not([type=search])").forEach((input) => {
          input.type = "search";
        });
        element.querySelectorAll(".pagefind-ui__form button:not(.btn)").forEach((button) => {
          button.classList.add("btn");
        });
      };
      enhance();
      // "Load more" button is created and destroyed on each search
      new MutationObserver(enhance).observe(element, { childList: true, subtree: true });
    });
  </script>
{{- end }}
